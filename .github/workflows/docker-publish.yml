name: Docker Build and Publish

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ops: ${{ steps.filter.outputs.ops }}
      dev: ${{ steps.filter.outputs.dev }}
      media: ${{ steps.filter.outputs.media }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ops:
              - 'apps/ops-bot/**'
            dev:
              - 'apps/dev-bot/**'
            media:
              - 'apps/media-bot/**'
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.github/workflows/docker-publish.yml'

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ops-bot, dev-bot, media-bot]
        include:
          - app: ops-bot
            trigger: ops
          - app: dev-bot
            trigger: dev
          - app: media-bot
            trigger: media

    if: ${{ needs.changes.outputs[matrix.trigger] == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}/${{ matrix.app }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Update Infrastructure Repository (GitOps)
        if: github.ref == 'refs/heads/main'
        env:
          INFRA_REPO: mindulle/sonagi-iac
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Error: PAT_TOKEN is not set in GitHub Secrets."
            exit 1
          fi

          echo "🔄 Cloning infrastructure repository..."
          git clone https://${GH_TOKEN}@github.com/${INFRA_REPO}.git infra-repo
          cd infra-repo

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NEW_IMAGE="ghcr.io/${{ env.BASE_IMAGE_NAME }}/${{ matrix.app }}:sha-${SHORT_SHA}"

          echo "📝 Updating manifest to use image: ${NEW_IMAGE}"
          MANIFEST_PATH="kubernetes/sonagi-bots/02-deployment.yaml"

          sed -i "/name: ${{ matrix.app == 'ops-bot' && 'ops-bot' || matrix.app == 'dev-bot' && 'dev-bot' || 'media-bot' }}/{n;s|image: .*|image: ${NEW_IMAGE}|}" $MANIFEST_PATH

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $MANIFEST_PATH

          if git diff --staged --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "chore(${{ matrix.app }}): auto-update image to sha-${SHORT_SHA} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
